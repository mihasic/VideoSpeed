name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Tag matches manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          v="v$(jq -r .version extension/manifest.json)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != manifest $v"; exit 1; }

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      zip: VideoSpeed-${{ github.ref_name }}-unsigned.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: VideoSpeed-unsigned
      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "VideoSpeed-${GITHUB_REF_NAME}-unsigned.zip" --repo "$GITHUB_REPOSITORY" --generate-notes --title "VideoSpeed $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
