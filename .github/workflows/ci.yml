name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax-check JS
        run: for f in $(find extension -name '*.js'); do node --check "$f"; done
      - name: Validate manifest
        run: node -e 'const m=require("./extension/manifest.json"); if(m.manifest_version!==3) process.exit(1); console.log(m.name, m.version)'

  build:
    uses: ./.github/workflows/build.yml
